# GitHub 源码工具包：完整源码 + editable install；内部脚本仍由 CLI 调用。
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boss-hr-agent-toolkit"
version = "1.2.1"
description = "BOSS 直聘招聘端自动化：一个 Skill 与统一本地 CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "boss-hr-agent-toolkit maintainers" }]
dependencies = ["patchright==1.59.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "tomli>=2; python_version < '3.11'"]

[project.scripts]
boss-hr = "boss_hr.cli:main"

[tool.setuptools]
# 仅发布统一 Python 入口；运行需要保留根目录中的业务脚本和 shared/。
packages = [
    "boss_hr",
    "boss_hr.commands",
    "boss_hr.application",
    "boss_hr.adapters",
    "boss_hr.contracts",
]

[tool.setuptools.package-dir]
"boss_hr" = "boss_hr"
"boss_hr.commands" = "boss_hr/commands"
"boss_hr.application" = "boss_hr/application"
"boss_hr.adapters" = "boss_hr/adapters"
"boss_hr.contracts" = "boss_hr/contracts"
